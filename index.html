<title>AI Agents — Study Guide</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');

  :root{
    --bg:#12151B; --panel:#171B23; --border:#252A35;
    --text:#E7E9EE; --dim:#8D95A6; --dim2:#5B6472;
    --amber:#E3A346; --teal:#4FB6A8;
    --font-display:'Fraunces',Georgia,serif;
    --font-body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; background:var(--bg); overscroll-behavior:none;}
  body{
    color:var(--text); font-family:var(--font-body);
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
  }
  button{font:inherit; cursor:pointer; -webkit-user-select:none; user-select:none;}
  #app{min-height:100%; display:flex; flex-direction:column;}
  ::selection{background:#E3A34655;}

  /* ---------- select screen ---------- */
  .select-screen{max-width:640px; margin:0 auto; width:100%; padding:28px 20px 50px;}
  .eyebrow-row{display:flex; align-items:center; margin-bottom:14px;}
  .eyebrow{font-family:var(--font-mono); font-size:11px; letter-spacing:.03em; color:#7C8598;}
  .h1{font-family:var(--font-display); font-weight:500; font-size:clamp(26px,7vw,34px); line-height:1.18; margin:0 0 12px; color:#F3F4F7;}
  .header-sub{font-size:15px; line-height:1.6; color:var(--dim); margin:0 0 20px; max-width:54ch;}
  .progress-line{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .progress-track{flex:1; height:4px; border-radius:2px; background:#232833; overflow:hidden;}
  .progress-fill{height:100%; background:#5B6472; border-radius:2px; transition:width .3s ease;}
  .progress-text{font-family:var(--font-mono); font-size:11px; color:var(--dim); white-space:nowrap;}

  .part-group{margin-bottom:30px;}
  .part-label{font-family:var(--font-mono); font-size:11.5px; letter-spacing:.02em; margin-bottom:14px; padding-left:2px;}
  .spine-wrap{position:relative;}
  .spine-line{position:absolute; left:17px; top:6px; bottom:6px; width:2px; border-radius:1px;}

  .node{position:relative; display:flex; align-items:flex-start; width:100%; background:transparent; border:none; text-align:left; padding:10px 8px 10px 0; color:inherit; z-index:1;}
  .node-marker-wrap{width:36px; flex-shrink:0; display:flex; justify-content:center;}
  .node-marker{width:26px; height:26px; border-radius:50%; border:2px solid; background:var(--panel); display:flex; align-items:center; justify-content:center; margin-top:2px;}
  .node-number{font-family:var(--font-mono); font-size:11px; font-weight:600;}
  .node-body{flex:1; padding-left:12px; padding-top:1px;}
  .node-tag{font-family:var(--font-mono); font-size:10.5px; padding:2px 7px; border:1px solid; border-radius:3px; display:inline-block;}
  .node-title{font-family:var(--font-display); font-size:18.5px; font-weight:500; color:#F0F1F5; margin-top:5px; margin-bottom:3px;}
  .node-tagline{font-size:13.5px; line-height:1.45; color:var(--dim);}

  .footer-note{font-size:12px; line-height:1.6; color:var(--dim2); margin-top:36px; padding-top:18px; border-top:1px solid var(--border);}

  /* ---------- read screen ---------- */
  .read-screen{flex:1; display:flex; flex-direction:column; height:100vh; height:100dvh;}
  .top-bar{display:flex; align-items:center; gap:12px; padding:calc(16px + env(safe-area-inset-top)) 16px 12px; border-bottom:1px solid var(--border); flex-shrink:0;}
  .back-btn{background:var(--panel); border:1px solid var(--border); border-radius:8px; width:34px; height:34px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .top-bar-text{min-width:0;}
  .top-bar-tag{font-family:var(--font-mono); font-size:10.5px; margin-bottom:2px;}
  .top-bar-title{font-family:var(--font-display); font-size:17px; font-weight:500; color:#F0F1F5; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .progress-bar-track{height:2px; background:var(--border); flex-shrink:0;}
  .progress-bar-fill{height:100%; transition:width .1s linear;}

  .read-content{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .read-inner{max-width:620px; margin:0 auto; padding:26px 20px calc(70px + env(safe-area-inset-bottom));}
  .read-tagline{font-family:var(--font-display); font-style:italic; font-size:17px; line-height:1.5; color:#B7BDC9; margin:0 0 30px; padding-bottom:22px; border-bottom:1px solid var(--border);}
  .section{margin-bottom:26px;}
  .section-h{font-family:var(--font-display); font-weight:500; font-size:19px; color:#F0F1F5; margin:0 0 8px;}
  .section-b{font-size:15px; line-height:1.68; color:#CBD0DA; margin:0;}

  .takeaway-block{margin-top:34px; padding:4px 0 4px 18px; border-left:3px solid;}
  .takeaway-header{font-family:var(--font-mono); font-size:11.5px; letter-spacing:.02em; margin-bottom:10px;}
  .takeaway-list{margin:0; padding:0; list-style:none;}
  .takeaway-item{font-size:14.5px; line-height:1.6; color:#CBD0DA; margin-bottom:9px; padding-left:18px; position:relative;}
  .takeaway-dash{position:absolute; left:0; top:0;}

  .chapter-nav{display:flex; justify-content:space-between; gap:16px; margin-top:44px; padding-top:20px; border-top:1px solid var(--border);}
  .nav-btn{background:transparent; border:none; color:inherit; padding:0; max-width:48%;}
  .nav-btn.next{text-align:right;}
  .nav-btn-label{font-family:var(--font-mono); font-size:10.5px; color:var(--dim2); margin-bottom:4px;}
  .nav-btn-title{font-size:14px; color:#C9CFDB; line-height:1.4;}

  svg.icon{display:block;}

<script>
/* ======================================================================

const CHAPTERS = [
  {
    id: 1, part: "I", tag: "Foundations", title: "Introduction",
    tagline: "What an agent is, and the four things that make one.",
    sections: [
      { h: "What Is an AI Agent?", b: "The book leans on Russell &amp; Norvig's classic definition: an agent perceives its environment through sensors and acts on it through actuators. Four pieces make that concrete — the environment (the world it operates in), sensors (how it observes that world), actuators (how it acts on it), and the agent program, the decision-making \"brain\" that turns observations into actions. In an AI agent, that brain is an LLM." },
      { h: "The LLM as the Brain", b: "Before anything else: an LLM predicts the next token. Input text is broken into tokens, and the model generates output one token at a time, feeding each new token back into its own input — a loop called autoregression. Every agent behavior in this book, from conversation to tool calls, rides on top of this loop." },
      { h: "From Chatbots to Reasoning Models", b: "GPT-3.5 in the original ChatGPT (Nov 2022) proved a next-token predictor could hold humanlike conversation. Since then, labs have trained models to reason explicitly before answering — reasoning LLMs, the subject of Chapter 3 and a prerequisite for good agent behavior." },
      { h: "Augmenting the LLM", b: "A reasoning LLM alone is still a stateless text-in/text-out function — it forgets everything between calls and can't touch the outside world. Becoming an agent means bolting on memory so conversations persist (Ch. 4), tools so it can act on and observe its environment (Ch. 5), and planning so it can break a goal into steps and reflect on how they're going (Ch. 6)." },
      { h: "The Agentic System: Autonomy", b: "Combine a reasoning LLM with memory, tools, and planning and you get a system that can choose tools, revise its own plan, or decide it's done — autonomy. Autonomy is a spectrum, not a switch: some systems execute one constrained step at a time, others run with almost no guardrails. Partial autonomy in an orchestrated workflow still counts as agentic, as long as the system shows goal-directed, independent decision-making. More freedom means evaluation (Ch. 7) matters more, not less." },
      { h: "Specializations", b: "Part II covers three variants built on the single-agent core: multi-agent systems, where specialized agents collaborate under (often) a supervisor agent instead of one agent doing everything (Ch. 8); multi-modal agents, whose LLM understands and/or generates images, audio, or video because the digital world isn't purely text (Ch. 9); and coding agents, which run, test, and fix code in a real execution environment rather than just discussing it — enabling \"vibe coding\" for non-engineers (Ch. 10)." },
      { h: "Building the TinyAgent", b: "The book's running project is the TinyAgent — a deliberately minimal agent class built up one module at a time as each chapter adds a capability: an LLM slot (Ch. 2–3), a memory slot (Ch. 4), a tools slot (Ch. 5), a planner slot (Ch. 6). It starts as a skeleton class with placeholder methods and ends the book with native tool-calling, retrieval, planning, and reflection wired in." }
    ],
    takeaways: [
      "Agent = environment + sensors + actuators + agent program (the LLM).",
      "LLMs alone are stateless and environment-blind — agents need memory, tools, and planning bolted on.",
      "Autonomy is a spectrum; more autonomy raises the stakes on evaluation and guardrails.",
      "Multi-agent, multi-modal, and coding agents are specializations of the same core architecture, not alternatives to it."
    ]
  },
  {
    id: 2, part: "I", tag: "The Brain", title: "Large Language Models",
    tagline: "Tokens, training, Transformers, and why attention is expensive.",
    sections: [
      { h: "Tokens In, Tokens Out", b: "Every LLM call starts by chopping input into tokens — sub-word pieces that let the model handle words it's never seen (\"flamingos\" splits into \"flamingo\" + \"s\"). Output works the same way in reverse: one token generated at a time, each fed back into the model's own input before the next prediction." },
      { h: "From Language Model to Agent Brain", b: "A freshly pre-trained LLM is a \"base model\" — good at continuing text, not at acting like an assistant. Post-training teaches it to parse structured inputs (a system prompt, a multi-turn conversation, eventually a tool call) and answer in the format an agent harness expects. The book's running examples use Gemma 3 (no native reasoning or tool-calling, useful for learning to prompt these behaviors by hand) and Gemma 4 (trained natively for both)." },
      { h: "Training a Large Language Model", b: "Two phases. Pre-training is language modeling: take a huge filtered mix of web text, books, and code, hide the next token, and have the model predict it — repeatedly, correcting weights on every miss. This builds broad capability but not obedience. Post-training then applies supervised fine-tuning (SFT) on high-quality input/output pairs so the model follows instructions, and reinforcement learning (RL) on top — including RLVR, reinforcement learning from verifiable rewards, where correctness can be checked automatically (a test passing, an answer matching), using algorithms like GRPO." },
      { h: "Inside the Transformer", b: "Nearly every LLM since ~2020 is a Transformer decoder: a tokenizer, a stack of Transformer blocks, and a language-modeling head. The tokenizer maps text to IDs from a fixed vocabulary; each ID has a learned embedding vector. The blocks — self-attention paired with a feed-forward network, repeated many times — enrich those vectors with context; the LM head converts the final vector into a probability distribution over the next token. Two properties matter for everything downstream: context length (how much fits in one call) and the KV cache (what drives latency and cost)." },
      { h: "How Self-Attention Works", b: "Each token's embedding is projected through three learned matrices into a query, key, and value vector. Relevance scoring multiplies the current token's query against every token's key to get a relevance score. Information combining then takes a weighted sum of every token's value vector, weighted by those scores — producing the enriched vector for the current position. Stack enough layers and representations get progressively more contextual." },
      { h: "KV-Caching", b: "Naively, generating token N+1 means recomputing keys and values for all N previous tokens — pure waste, since those don't change. The KV cache stores them once and reuses them, so each new step computes Q/K/V only for the newest token. This is the single biggest lever on inference latency, paid for with memory that grows as the sequence gets longer." },
      { h: "More Efficient Attention", b: "Grouped-Query and Multi-Query Attention share K/V projections across multiple heads instead of giving each head its own, shrinking the cache. DeepSeek's Multi-head Latent Attention (MLA) compresses K and V into a much smaller latent representation before caching, decompressing on the fly, with positional info (RoPE) handled separately so the cache doesn't need recomputing. DeepSeek Sparse Attention (DSA) goes further, using a lightweight indexer to attend to only the most relevant prior tokens instead of the full history." },
      { h: "Mixture of Experts", b: "A dense Transformer runs every token through one shared feed-forward network. A Mixture-of-Experts (MoE) model replaces that with many smaller \"expert\" networks plus a router — a small trained network that sends each token to only a handful of experts. Total capacity grows far larger while inference cost per token stays roughly fixed, since most experts sit idle on any given token. Experts appear to specialize on fine-grained patterns rather than whole domains, though exactly what each one learns is still an open question." }
    ],
    takeaways: [
      "LLMs are autoregressive next-token predictors under the hood — everything else is scaffolding on top of that loop.",
      "Pre-training builds raw capability; SFT + RL/RLVR build instruction-following and reliability.",
      "Self-attention = project to Q/K/V → score relevance → weighted-combine values.",
      "KV caching, GQA/MLA/DSA, and MoE all exist to make that loop cheaper at scale."
    ]
  },
  {
    id: 3, part: "I", tag: "The Brain", title: "Reasoning Large Language Models",
    tagline: "Spending compute at inference time instead of only at training time.",
    sections: [
      { h: "Train-Time vs. Test-Time Compute", b: "For years, better LLMs mostly meant more train-time compute: bigger models, bigger datasets, more FLOPs, in both pre- and post-training. Reasoning LLMs shift some of that investment to inference itself — test-time compute — letting the model \"think\" longer before answering instead of only making training bigger." },
      { h: "Scaling Laws", b: "Scaling laws describe how performance improves with compute, data, and parameters — power laws with diminishing returns, which look like straight lines on a log-log plot. Kaplan's scaling laws: for a fixed compute budget, grow the model and feed it as much data as it can take without overfitting. Chinchilla's follow-up found most large models were actually undertrained — a smaller model trained on proportionally more data often beats a bigger, data-starved one at equal compute." },
      { h: "Two Families of Test-Time Compute", b: "Search against verifiers samples multiple answers or reasoning traces and picks the best one with a reward model or verifier — output-focused, generate-then-select. Modifying the proposal distribution instead trains or prompts the model to directly produce better reasoning, changing what gets generated in the first place." },
      { h: "Reward Models: ORM vs. PRM", b: "An Outcome Reward Model (ORM) scores only the final answer, ignoring how the model got there. A Process Reward Model (PRM) scores the intermediate reasoning steps themselves, catching a right answer reached through faulty logic (or the reverse). Many pipelines blend the two." },
      { h: "Prompting for Reasoning", b: "The cheapest way to get reasoning out of a non-reasoning model is Chain-of-Thought (CoT) prompting — asking for, or demonstrating via one-shot/few-shot examples, step-by-step reasoning before the final answer. No training required, just more output tokens." },
      { h: "Search Against Verifiers, In Practice", b: "Self-consistency samples many reasoning traces at higher temperature and takes a majority vote over the final answers — no reward model needed, just redundancy plus voting. Best-of-N sampling generates N candidates and uses a verifier (an ORM on final answers, or a PRM averaged over reasoning steps) to pick the single best one." },
      { h: "Modifying the Proposal Distribution: SFT", b: "Supervised fine-tuning for reasoning trains on (query, reasoning trace, answer) triplets. Flan-PaLM mixed Chain-of-Thought-annotated examples into large-scale instruction tuning across ~1,800 tasks, so the fine-tuned model reasons more readily when prompted \"let's think step-by-step.\" The bottleneck is always data — high-quality reasoning traces are expensive to collect at scale." },
      { h: "Modifying the Proposal Distribution: RL", b: "DeepSeek-R1-Zero showed reasoning can emerge from RL alone, with no SFT on reasoning traces at all. Starting from a base model, it trained on just two rule-based rewards — correct <think>/<answer> formatting, and correctness of the final answer — via GRPO. Left to satisfy those rewards, the model discovered on its own that longer, more thorough reasoning led to higher accuracy, and its traces grew progressively longer over training. DeepSeek-R1 builds on this with refinements for readability and stability." },
      { h: "Native Reasoning", b: "A trained reasoning model needs special chat-template tokens to switch reasoning on or off — Gemma 4 uses a &lt;|think|&gt; token alongside turn-marker tokens for system/user/model. Inference engines like Ollama normally hide this bookkeeping." },
      { h: "Emerging Directions", b: "Multi-modal reasoning extends CoT-style techniques to non-text inputs (Multi-modal Chain-of-Thought chains an explicit visual+language reasoning step before the final answer). Efficient reasoning cuts the cost of long traces — Chain-of-Draft prompts the model to keep each step to a handful of words, trading readability for much shorter, cheaper traces at similar accuracy. Latent space reasoning goes furthest: Chain-of-Continuous-Thought feeds the last hidden state directly back in as the next input instead of decoding it into a token first, so the \"thinking\" never becomes human-readable text at all." }
    ],
    takeaways: [
      "Reasoning LLMs trade some train-time investment for test-time \"thinking\" — more inference compute, not just more training.",
      "Search-against-verifiers filters after generation; modifying the proposal distribution changes generation itself.",
      "Headline result: DeepSeek-R1-Zero shows reasoning can emerge from RL with simple correctness/format rewards alone — no labeled reasoning traces required.",
      "The frontier is shorter (Chain-of-Draft) and even invisible (latent-space) reasoning traces."
    ]
  },
  {
    id: 4, part: "I", tag: "Memory", title: "Memory",
    tagline: "Short-term recall, long-term retrieval, and context as a scarce resource.",
    sections: [
      { h: "Types of Memory", b: "Borrowed from human-memory research: working memory is short-term — the live chat history replayed into the LLM on every call. Long-term memory splits into episodic (specific past events — what actions the agent already took and what happened), semantic (facts about the world — a knowledge base, a codebase, Wikipedia), and procedural (how to do things — baked into model parameters or a persistent system prompt)." },
      { h: "Conversation Memory", b: "In its simplest form, memory is a growing list of role-tagged messages (system/user/assistant) replayed on every call. The LLM doesn't \"remember\" so much as get re-shown the whole conversation each time — statelessness hidden behind a growing prompt." },
      { h: "Trimming", b: "The cheapest fix once history threatens to overflow the context window: drop the oldest turns, keeping the system message plus the last few exchanges. Simple and cheap, but lossy — older context is just gone." },
      { h: "Summarization", b: "Rather than discarding old turns, an LLM compresses them into a running summary prepended to new queries. You can stack summaries turn-by-turn, summarize in batches, or maintain one continually-updated rolling summary — each a different trade-off between compression and information loss." },
      { h: "Retrieval-Augmented Generation (RAG)", b: "The standard way to give an LLM long-term memory beyond its context window. Ingestion: external documents get embedded (via an embedding model) into vectors and stored in a vector database. Inference: the query is embedded the same way, the most similar stored vectors are retrieved (similarity search, sometimes hybrid with keyword search), and retrieved text plus the query are packed into the prompt so the model can ground its answer in it." },
      { h: "Agentic RAG", b: "Vanilla RAG is a fixed pipeline — retrieval happens automatically before generation, no choice involved. Agentic RAG gives the agent retrieval as a tool it decides whether and how to use: pick which source to query, search, use those results to inform a second search, decide when it has enough to answer. This generalizes to multi-agent RAG, where smaller retrieval agents (each tied to one source — a vector DB, web search, Slack, Gmail) are coordinated by a more capable orchestrator." },
      { h: "Context Engineering for Multi-Agent Systems", b: "As agents grew tool lists and multi-agent structures, wording one prompt well evolved into context engineering — deliberately managing everything in the model's context window: history, retrieved documents, tool schemas, instructions, across potentially many agents at once. In multi-agent systems this compounds, since each sub-agent's context (and the context of their interactions) needs managing; delegating narrow tasks to small, specialized agents keeps each individual context manageable and easier to test." },
      { h: "Context As the Specification", b: "The authors push a mindset shift: an agent's context isn't just fuel for generation, it's a communication artifact — the query, a PLAN.md, a REQUIREMENTS.md, the codebase together specify what the agent is trying to do and why. As agents get more autonomous, tracking that \"why\" (not just checking the final output) becomes essential for debugging, reproducibility, and trust — and what counts as relevant context looks completely different across domains, from healthcare to law to software." }
    ],
    takeaways: [
      "Working memory = short-term chat history; long-term memory splits into episodic, semantic, and procedural.",
      "Trimming and summarization both fight context-window overflow, trading recall against cost differently.",
      "RAG = embed → store → retrieve → augment prompt → generate; agentic RAG hands the agent control of that loop.",
      "Context engineering — curating everything in the window, not just prompt wording — ties memory, tools, and multi-agent systems together."
    ]
  },
  {
    id: 5, part: "I", tag: "Action", title: "Tool Usage, Learning, and Protocols",
    tagline: "How agents act on the world, learn to do it well, and standardize the wiring.",
    sections: [
      { h: "Tool Creation", b: "A tool is usually just a documented function — from a one-line multiply(a, b) to a wrapper around a production API. The LLM only ever produces text, so it can't call a Python function directly; the tool needs a clear docstring/schema and a registry (e.g. a dict mapping a name string to the real function) so external code can dispatch once the LLM names it." },
      { h: "Tool Definition", b: "The LLM has to be told which tools exist before it can use them — via learning (tool-use behavior baked in during fine-tuning) or prompting (sharing definitions live in the system prompt as JSON schemas). Modern models lean toward the second: rather than memorizing specific tools, they're tuned for general instruction-following and read whatever tool definitions show up in the prompt at run time." },
      { h: "Tool Selection", b: "Given a query and a tool list, the model has to pick the right one (or none) — harder as tools multiply. A reasoning LLM can spend tokens deliberating over which tool fits, as long as it stays within the context budget. When the tool list itself gets too large for the prompt, discovery can borrow RAG's playbook: store schemas in a vector database and retrieve only the most relevant ones per query." },
      { h: "Tool Calling", b: "Once the LLM has \"decided,\" it just outputs a string expressing that intent — nothing executes until external code parses that string (e.g., extracting a JSON blob for the tool name and arguments) and calls the real function. The LLM's output is an instruction, not an action." },
      { h: "Tool Output Processing", b: "The tool's result has to get back to the model via two new message roles appended to history: an \"assistant\" message recording that the tool was called, and a \"tool\" message carrying the return value — before the next generation step." },
      { h: "Learning Tool Use", b: "In-context learning teaches tool use entirely at inference time — a few-shot example of a correctly formatted call, or even a faked prior turn where the assistant \"already\" called a tool. Supervised fine-tuning (e.g., Toolformer, one of the earliest successful approaches) trains directly on examples of correct calls. RL pushes further with Tool-Integrated Reasoning (TIR) — weaving tool calls into the reasoning trace with special tokens marking thinking, calling, and answering; ToolRL uses GRPO (the same algorithm behind DeepSeek-R1) with simple correctness-of-call rewards." },
      { h: "Model Context Protocol (MCP)", b: "Before a shared standard, connecting N LLMs to M tools meant N×M custom integrations, and any tool API changing broke every integration built on it. MCP (Anthropic, released Nov 2024) standardizes the connection itself — often called \"the USB-C port of AI\" — turning N×M into N+M. Three components: an MCP host (the LLM application managing the interaction), an MCP client inside the host (one per connected server, handling communication), and an MCP server (exposes one service's tools, resources, and prompt templates over the protocol)." },
      { h: "The MCP Flow", b: "A typical flow: the host asks a server what tools it has, forwards that list to the LLM with the user's query, the LLM decides to call a specific tool, the client relays the call to the server, the server executes it and returns a result, and the LLM either calls another tool or answers the user with it." },
      { h: "Skills", b: "Tools and MCP give an agent actions, not judgment about when and how to sequence them for a specific workflow — Anthropic's Skills fill that gap: bundles of instructions, scripts, and resources loaded as needed via progressive disclosure across three layers. Layer 1 (always loaded): the skill's name and short description. Layer 2 (loaded once triggered): the full SKILL.md instructions. Layer 3 (loaded only if needed): additional bundled reference docs, scripts, or templates." }
    ],
    takeaways: [
      "A tool call is a two-step handoff: the LLM expresses intent as text, external code executes it and returns the result.",
      "Tool-use behavior can be taught via prompting (in-context), SFT (Toolformer), or RL (ToolRL, TIR) — trading setup cost for reliability.",
      "MCP turns N×M custom tool integrations into N+M by standardizing host/client/server communication.",
      "Skills sit above tools: they teach an agent the recipe — which tools, in what order, under what conventions."
    ]
  },
  {
    id: 6, part: "I", tag: "Autonomy", title: "Planning and Reflection",
    tagline: "Breaking a goal into steps, sequencing actions, and learning from mistakes.",
    sections: [
      { h: "Task Decomposition", b: "Planning starts by breaking a goal into smaller subtasks the agent can actually execute. Chain-of-Thought prompting is itself a form of decomposition — each reasoning step relies on the ones before it, breaking a problem into sequential sub-steps rather than solving it in one leap." },
      { h: "Action Sequencing", b: "Decomposing a problem into subtasks isn't enough — an agent also needs to sequence real actions (tool calls) to move from its current state toward the goal, adjusting as new information arrives. ReAct-style prompting formalizes this: the agent alternates Thought (reason about what to do next), Action (call a tool), and Observation (read the result), looping until it decides the task is done — letting it revise its plan dynamically rather than follow a fixed script." },
      { h: "Reflection", b: "Plans rarely survive first contact with reality intact. Reflection means the agent looks back at what it's done — the plan, the actions, the results — and changes course when something isn't working, instead of mechanically continuing a broken plan. Paired with planning, this feedback loop is what keeps agents from getting stuck at a local minimum: a decent-but-wrong approach it never reconsiders." },
      { h: "Self-Improvement", b: "Reflection improves a single run; the more ambitious goal is agents that keep improving across runs without constant human-labeled correction data — expensive to collect at agentic scale. Test-Time Reinforcement Learning (TTRL) updates a model's actual parameters using RL signals gathered while it interacts with its environment at inference time, rather than treating the model as frozen once deployed. RISE adds explicit introspection steps to iteratively critique and improve outputs; R-Zero-style methods generate their own training data and self-improve via RL without any human-labeled dataset." }
    ],
    takeaways: [
      "Task decomposition breaks a goal into subtasks; action sequencing turns those into an ordered, adaptable sequence of real tool calls.",
      "ReAct's Thought → Action → Observation loop is the core pattern behind most autonomous agent behavior.",
      "Reflection is the feedback loop that prevents agents from getting stuck in a locally-okay-but-wrong plan.",
      "Self-improvement (TTRL, RISE, R-Zero) pushes further: updating the model itself from its own experience, not just adjusting one run."
    ]
  },
  {
    id: 7, part: "I", tag: "Rigor", title: "Evaluating Agents",
    tagline: "Why one score rarely tells you what you think it does.",
    sections: [
      { h: "Public Benchmarks and Leaderboards", b: "A benchmark pairs a fixed set of tasks with a scoring method so different models compare on the same yardstick — e.g., SWE-bench Verified scores an agent on whether it can turn a real GitHub issue into a patch that passes the project's hidden tests. Two 80% scores on two different benchmarks can represent completely different claims, scored completely differently." },
      { h: "Reading Benchmark Scores Critically", b: "Before trusting a number, ask: how was it produced (deterministic check vs. LLM judge)? Is partial credit given, which can flatter an agent that rarely finishes a multi-step task end-to-end? And which agentic harness was it run in — the same model can score very differently, even flip rankings against another model, depending on how the harness builds prompts, parses tool calls, and manages retries. A benchmark score is really a (model, harness) pair, not a property of the model alone." },
      { h: "Human Evaluation", b: "Direct scoring has a person rate a single output against criteria (e.g., 4/5). Preference evaluation shows two agents' outputs side by side and asks which is better — a comparative judgment humans make more reliably than absolute ones. Scaled across many tasks, preference judgments produce win rates, and comparing more than two agents extends naturally into an Elo rating system, borrowed from chess." },
      { h: "Automated Evaluation", b: "Human evaluation doesn't scale to the iteration volume agent development requires. Automated methods span deterministic checks (exact match, unit tests, a compiler), LLM-as-judge scoring, and rubric-based evaluation, which decomposes a complex judgment into several independently-scorable criteria for more reliable grading." },
      { h: "Trajectory Evaluation", b: "Outcome evaluation only checks the final answer; trajectory evaluation examines the whole sequence of steps the agent took, surfacing failure modes an outcome score would miss entirely — unsound intermediate reasoning, unnecessary or inefficient tool calls, wasted steps — even when the final answer happens to be right." },
      { h: "Reliability: pass@k vs. pass^k", b: "pass@k asks: across k attempts, did the agent succeed at least once? It measures capability, and climbs the more attempts you allow. pass^k (pass-hat-k) asks the opposite: did all k attempts succeed? It measures reliability — actual consistency, which is what production use cases usually need. Two models can tie on pass@1 and diverge sharply on pass^k, revealing that one is meaningfully more dependable even though their best case looks identical." },
      { h: "Safety", b: "Safety evaluation splits by who's causing potential harm. Misuse: a malicious user asks the agent to do something harmful — measured by refusal rate (e.g., AgentHarm). Manipulation: an attacker hijacks the agent through the data it processes — prompt injection (malicious instructions hidden in a document, tool result, or webpage) or memory poisoning (corrupting stored context so the agent later acts on false premises) — measured by attack success rate (AgentDojo, Agent Security Bench). No adversary at all: on a benign task, the agent causes harm through its own error — the least standardized category, best covered by your own test cases and guardrails." },
      { h: "Building Your Own Evals", b: "Public benchmarks are useful signals but rarely match your actual deployment. A small, well-curated set of test cases mirroring real usage — covering realistic failure modes, not just easy successes — scored with the methods above and run automatically on every change, is the most reliable way to catch regressions and pick the right model or framework." }
    ],
    takeaways: [
      "A benchmark score is really a (model, harness, scoring-method) triple — ask how it was produced before comparing numbers.",
      "Human eval, especially preference judgments, remains the gold standard automated methods are validated against.",
      "pass@k measures ceiling capability; pass^k measures actual reliability — they can disagree sharply.",
      "Agent safety splits into misuse, adversarial manipulation (prompt injection / memory poisoning), and benign self-inflicted harm — each needs its own test cases."
    ]
  },
  {
    id: 8, part: "II", tag: "Specialization", title: "Multi-Agent Systems",
    tagline: "Trading one generalist for a team of coordinated specialists.",
    sections: [
      { h: "What Makes a Multi-Agent System", b: "A multi-agent system (MAS) deploys several agents toward a shared goal, often each owning a specific sub-goal — a search agent and a summarization agent both serve \"research this topic\" but do different jobs. Environments can be physical (robots), virtual (simulated worlds), or text-based (a shared codebase or chat). Agents can be homogeneous (identical, good for parallelizing similar work), heterogeneous (distinct roles, tools, even different underlying LLMs), or show emergent specialization, where identical agents diverge into roles purely through interacting with each other over time." },
      { h: "Orchestration Patterns", b: "Four topologies. Centralized: one orchestration agent assigns tasks and manages communication — simplest to build, but a single point of failure. Decentralized: agents share responsibilities with no clear leader — more resilient, harder to coordinate. Hierarchical: agents sit in layers with different degrees of authority. Federated: agents in separate organizations communicate only indirectly, preserving data privacy across boundaries that don't fully trust each other." },
      { h: "Frameworks", b: "General-purpose frameworks implement these patterns with different philosophies — CAMEL, an early framework built around role-play (an \"AI user\" and \"AI assistant\" converse in character, e.g. blogger and programmer, until the task is done), plus MetaGPT, AutoGen, LangGraph, and CrewAI. No single one dominates every use case." },
      { h: "Communication Protocols", b: "Just as MCP standardizes agent-to-tool communication, Agent2Agent (A2A) — developed by Google — standardizes agent-to-agent communication, so agents built on different frameworks (LangGraph, CrewAI, AutoGen) and hosted on different platforms (AWS, Azure, GCP) can work together without custom point-to-point integrations for every pair." },
      { h: "Agent Society: Emotional Intelligence", b: "MAS research borrows psychology concepts like Theory of Mind — recognizing that others hold different beliefs, desires, and emotions than you do — and finds early, partial evidence of ToM-like behavior emerging in LLM-based agents, relevant to how well agents cooperate, negotiate, or model a human user's intent." },
      { h: "Simulations", b: "To study social behavior directly, researchers build simulated worlds — most influentially \"Generative Agents: Interactive Simulacra of Human Behavior,\" which placed 25 distinct LLM-driven agents (each with a unique profile — memories, personality, routine) in Smallville, a pixel-sandbox town, and watched them independently plan their days, attend group events, and form relationships nobody explicitly scripted." },
      { h: "Deep Research Agents", b: "The AI co-scientist (built on Gemini 2.0) takes a research goal and documents, then orchestrates specialized agents — generation (proposes hypotheses via literature search), reflection (critiques quality), ranking (Elo-style tournaments via simulated debate), proximity (clusters/dedupes similar hypotheses), and evolution — under a supervisor, aiming for plausible, novel, testable, safe proposals. Agent Laboratory takes a more fixed, three-phase structure — literature review (a \"PhD student\" agent iteratively queries arXiv), experimentation (plan, prepare data, run experiments across PhD-student, postdoc, and engineer agent roles), and report writing — producing both a research report and reproducible code." }
    ],
    takeaways: [
      "MAS trades one generalist agent for several specialists coordinated toward a shared goal.",
      "Orchestration pattern (centralized / decentralized / hierarchical / federated) is a resilience-vs-simplicity trade-off, not just a technical choice.",
      "A2A standardizes agent-to-agent communication the way MCP standardizes agent-to-tool communication.",
      "Deep Research systems (AI co-scientist, Agent Laboratory) show MAS applied end-to-end, from literature review to a finished report."
    ]
  },
  {
    id: 9, part: "II", tag: "Specialization", title: "Multi-Modal Understanding",
    tagline: "Teaching an LLM to see and hear, and connecting that to language.",
    sections: [
      { h: "What Are Multi-Modal LLMs?", b: "A multi-modal LLM (MLLM) processes and/or generates modalities beyond text — commonly images, audio, video. Most current MLLMs focus on the input side (understanding), since encoding new inputs is cheaper and needs fewer architectural changes than generating new modalities. Three components (plus an optional fourth): an encoder (modality → embeddings), a connector (adapts those embeddings for the LLM), the LLM (processes everything, generates text), and optionally a generator (produces non-text output)." },
      { h: "Encoding Text (the Baseline)", b: "Text encoding — a tokenizer chopping input into pieces, each mapped to a learned embedding — is the baseline every other modality's encoder has to match, since the LLM only ever consumes embeddings." },
      { h: "Encoding Images", b: "The Vision Transformer (ViT) mimics tokenization for images: cut the image into fixed-size patches, treat each patch like a \"word,\" flatten and project them, run them through a standard Transformer encoder. CLIP builds on this by training a ViT image encoder and a text encoder together with contrastive learning — pulling matching image/text pairs' embeddings close, pushing mismatched pairs apart — producing a shared embedding space." },
      { h: "Encoding Audio", b: "wav2vec 2.0 samples overlapping windows of raw audio as its version of tokens, runs them through a CNN for initial features, then a Transformer encoder for contextualized representations — trained via masked prediction, a learned discrete codebook of quantized embeddings, and contrastive learning. HuBERT extends this; Whisper and CLAP are other prominent audio encoders for speech and general audio-text alignment." },
      { h: "Encoding Video", b: "Video encoding largely extends image encoding with a temporal dimension — a sequence of frames, sometimes plus audio and subtitles. ViViT and TimeSformer adapt the Vision Transformer to model motion across frames; some approaches simply apply image-only CLIP frame-by-frame." },
      { h: "Many-Modality: ImageBind", b: "Rather than a separate pipeline per pair of modalities, ImageBind trains one shared embedding space across six modalities at once (images, audio, video, thermal, depth, motion sensor data) by anchoring everything to images during contrastive training — letting modalities never directly paired in training still end up comparable through their shared alignment with images." },
      { h: "Connecting Modalities: Projection-Based", b: "The simplest connector: a lightweight MLP maps the encoder's output directly into the LLM's embedding space, prefixed onto the text tokens. Cheap and simple, but produces many tokens per image/clip that eat up context, and its limited capacity caps expressive power." },
      { h: "Connecting Modalities: Query-Based", b: "The Q-Former (introduced in BLIP-2) uses a small Transformer with a fixed set of learnable \"query\" embeddings that attend to the encoder's output and compress it to a fixed, small number of vectors, trained via contrastive learning. Scales far better to large inputs like video (fixed output size regardless of input length), with more expressive power than plain projection, at the cost of a more complex training procedure and added latency." },
      { h: "Connecting Modalities: Fusion-Based", b: "Flamingo modifies the LLM's own architecture: a perceiver resampler compresses vision features to a fixed size, then feeds them into new, trainable \"gated\" cross-attention layers interleaved through the LLM — letting the model attend to visual features at every layer, not just as a prefix. The vision encoder and LLM stay frozen; only the resampler and new cross-attention layers train. Most expressive of the three approaches, but demands real architectural change and more training." }
    ],
    takeaways: [
      "An MLLM = encoder (modality → embeddings) + connector (adapt for the LLM) + LLM (+ optional generator).",
      "ViT/CLIP for images, wav2vec 2.0/HuBERT for audio, ViViT/TimeSformer for video — all adapt the Transformer's tokenize-then-attend pattern to a new modality.",
      "Projection, query-based (Q-Former), and fusion-based (Flamingo) connectors trade off simplicity, scalability, and expressive power differently.",
      "ImageBind shows modalities can share one embedding space without ever being directly paired in training, by anchoring everything to a common modality."
    ]
  },
  {
    id: 10, part: "II", tag: "Specialization", title: "Code Agents and Code LLMs",
    tagline: "From autocomplete to resolving real GitHub issues.",
    sections: [
      { h: "Code Agents for Non-Coders", b: "Code agents extend beyond software engineers — a non-coder asking for a plot never has to see the underlying code. Behind the scenes the agent still does real engineering: decide how to retrieve the data (a handed-over file read with pandas/polars, a filesystem searched via CLI tools, or a database queried with generated SQL), then write and run the code that produces the result." },
      { h: "Code Tools", b: "File manipulation tools (read/search/edit, often thin wrappers around cat, grep, sed, ls, glob) let the agent navigate and modify a codebase. A code interpreter/sandbox gives it an isolated place to actually execute generated code. Beyond these: command-line/VM access for filesystem work, computer-use tools for interacting with GUIs directly, code search beyond plain text matching, and SQL tools connecting to real databases — each with its own security trade-offs, generally scoped under a principle of least privilege." },
      { h: "Context Management", b: "A software engineering agent's context balloons fast — system prompt, persona, tool descriptions, security instructions, often the whole repository's structure, repeated on nearly every call across a long multi-step trajectory. Because so much of that is static and repeats call after call, prompt/KV caching (Ch. 2) pays off enormously: the fixed prefix (system prompt + repo structure) gets cached instead of recomputed at every step, a major lever on latency and cost for long coding sessions." },
      { h: "Code Agents for Software Engineering", b: "For a professional engineer, expectations shift from \"write a function\" to \"resolve a real issue across a repository\" — reading and understanding unfamiliar code, reproducing bugs, writing and running tests, debugging. Early agents like the original SWE-agent needed a purpose-built, constrained Agent-Computer Interface just to make a repository navigable, since models at the time couldn't reliably use general-purpose tools well enough on their own. Newer models, trained directly on tool-use and multi-step software-engineering trajectories, need far less of that scaffolding. SWE-bench formalizes the task: turn a real GitHub issue into a patch that makes the project's hidden test suite pass." },
      { h: "Task-Specific Workflows", b: "Not every coding problem needs a full autonomous agent — a fixed, static workflow can be more reliable and cheaper. Agentless is the standout example: a three-phase, RAG-like pipeline that localizes the relevant code for an issue (search), generates several candidate patches from an LLM (repair), then uses LLM-generated unit tests to rank and select the best candidate — no agentic loop required, and competitive with fully agentic approaches on SWE-bench-style tasks." },
      { h: "Building Code LLMs", b: "A coding agent is only as good as the model underneath it, which needs training that differs from a generalist LLM in scale and data composition — Qwen3 Coder, for example, pre-trains on 7.5 trillion tokens, 70% of which is code. Beyond raw code volume, these models specifically need tool-use data (trajectories that call a tool like grep and act on the result), multi-step data (a full reproduce-edit-test-patch cycle spanning many turns), and unit-test data (code paired with tests that verify it) — because \"does the code run and pass its tests\" gives a clean, automatically checkable reward, exactly what RLVR needs to train on at scale." }
    ],
    takeaways: [
      "Code agents serve non-coders as much as engineers — often the value is never having to see the underlying code at all.",
      "File tools, a sandboxed interpreter, and SQL/CLI access form the core toolkit; least-privilege scoping matters because these tools can cause real, irreversible damage.",
      "Prompt/KV caching is what makes long, repository-heavy agent sessions affordable.",
      "Agentless shows a fixed three-phase pipeline (localize → repair → test-rank) can match agentic approaches without a full autonomous loop.",
      "Coding LLMs need code-heavy pre-training plus tool-use, multi-step, and unit-test data — code's checkability makes RLVR especially effective here."
    ]
  }
];

const PART_LABEL = { I: "Part I — The Anatomy of an Agent", II: "Part II — Specialized Agents" };
const ACCENT = { I: "#E3A346", II: "#4FB6A8" };

/* ======================================================================
   STORAGE (plain localStorage — this is a standalone page, not a Claude
   artifact, so the browser's own storage API works fine here)
   ====================================================================== */
const PROGRESS_KEY = "agent-guide:visited-chapters";
function loadProgress(){
  try { return new Set(JSON.parse(localStorage.getItem(PROGRESS_KEY) || "[]")); }
  catch(e){ return new Set(); }
}
function saveProgress(set){
  try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(Array.from(set))); }
  catch(e){ /* ignore */ }
}

/* ======================================================================
   ICONS (inline SVG, no external icon library needed)
   ====================================================================== */
const ICON = {
  back: '<svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C9CFDB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>',
  check: '<svg class="icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#12151B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  book: '<svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#7C8598" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>'
};

/* ======================================================================
   STATE + RENDER
   ====================================================================== */
let state = { view: "select", activeId: null, visited: loadProgress() };

function esc(s){ return s; } // content is authored, not user input

function render(){
  const app = document.getElementById("app");
  app.innerHTML = state.view === "select" ? renderSelect() : renderRead();
  wireEvents();
  if (state.view === "read") {
    const rc = document.querySelector(".read-content");
    if (rc) rc.scrollTop = 0;
    updateProgressBar();
  }
  window.scrollTo(0,0);
}

function renderSelect(){
  const readCount = state.visited.size;
  const partI = CHAPTERS.filter(c => c.part === "I");
  const partII = CHAPTERS.filter(c => c.part === "II");

  return `
    <div class="select-screen">
      <div class="eyebrow-row">${ICON.book}<span class="eyebrow" style="margin-left:7px;">Illustrated Guide to AI Agents — Study Edition</span></div>
      <h1 class="h1">Build the agent, chapter by chapter.</h1>
      <p class="header-sub">Ten modules, assembled in the same order the book adds them to the TinyAgent — reasoning brain first, then memory, tools, planning, evaluation, and the three specialized forms an agent can take.</p>
      <div class="progress-line">
        <div class="progress-track"><div class="progress-fill" style="width:${(readCount/CHAPTERS.length)*100}%"></div></div>
        <span class="progress-text">${readCount} / ${CHAPTERS.length} read</span>
      </div>
      ${renderPartGroup(PART_LABEL.I, ACCENT.I, partI)}
      ${renderPartGroup(PART_LABEL.II, ACCENT.II, partII)}
      <div class="footer-note">Condensed from <em>An Illustrated Guide to AI Agents</em> by Maarten Grootendorst &amp; Jay Alammar — summarized for faster review, not a replacement for the book.</div>
    </div>`;
}

function renderPartGroup(label, accent, chapters){
  return `
    <div class="part-group">
      <div class="part-label" style="color:${accent}">${label}</div>
      <div class="spine-wrap">
        <div class="spine-line" style="background:${accent}33"></div>
        ${chapters.map(ch => renderNode(ch, accent)).join("")}
      </div>
    </div>`;
}

function renderNode(ch, accent){
  const isRead = state.visited.has(ch.id);
  const marker = isRead
    ? `<div class="node-marker" style="border-color:${accent}; background:${accent}">${ICON.check}</div>`
    : `<div class="node-marker" style="border-color:${accent}"><span class="node-number" style="color:${accent}">${ch.id}</span></div>`;
  return `
    <button class="node" data-open="${ch.id}">
      <div class="node-marker-wrap">${marker}</div>
      <div class="node-body">
        <span class="node-tag" style="color:${accent}; border-color:${accent}55">${ch.tag}</span>
        <div class="node-title">${ch.title}</div>
        <div class="node-tagline">${ch.tagline}</div>
      </div>
    </button>`;
}

function renderRead(){
  const ch = CHAPTERS.find(c => c.id === state.activeId);
  if (!ch) return "";
  const accent = ACCENT[ch.part];
  const idx = CHAPTERS.indexOf(ch);
  const prev = idx > 0 ? CHAPTERS[idx-1] : null;
  const next = idx < CHAPTERS.length-1 ? CHAPTERS[idx+1] : null;

  return `
    <div class="read-screen">
      <div class="top-bar">
        <button class="back-btn" data-back="1">${ICON.back}</button>
        <div class="top-bar-text">
          <div class="top-bar-tag" style="color:${accent}">Chapter ${ch.id} · ${ch.tag}</div>
          <div class="top-bar-title">${ch.title}</div>
        </div>
      </div>
      <div class="progress-bar-track"><div class="progress-bar-fill" id="scrollFill" style="background:${accent}; width:0%"></div></div>
      <div class="read-content">
        <div class="read-inner">
          <p class="read-tagline">${ch.tagline}</p>
          ${ch.sections.map(s => `
            <section class="section">
              <h2 class="section-h">${s.h}</h2>
              <p class="section-b">${s.b}</p>
            </section>`).join("")}
          <div class="takeaway-block" style="border-left-color:${accent}">
            <div class="takeaway-header" style="color:${accent}">Key takeaways</div>
            <ul class="takeaway-list">
              ${ch.takeaways.map(t => `<li class="takeaway-item"><span class="takeaway-dash" style="color:${accent}">—</span>${t}</li>`).join("")}
            </ul>
          </div>
          <div class="chapter-nav">
            ${prev ? `<button class="nav-btn" data-open="${prev.id}"><div class="nav-btn-label">&larr; Previous</div><div class="nav-btn-title">${prev.title}</div></button>` : `<div></div>`}
            ${next ? `<button class="nav-btn next" data-open="${next.id}"><div class="nav-btn-label">Next &rarr;</div><div class="nav-btn-title">${next.title}</div></button>` : `<div></div>`}
          </div>
        </div>
      </div>
    </div>`;
}

function updateProgressBar(){
  const rc = document.querySelector(".read-content");
  const fill = document.getElementById("scrollFill");
  if (!rc || !fill) return;
  rc.addEventListener("scroll", () => {
    const max = rc.scrollHeight - rc.clientHeight;
    const pct = max > 0 ? Math.min(100, Math.max(0, (rc.scrollTop/max)*100)) : 0;
    fill.style.width = pct + "%";
  });
}

function wireEvents(){
  document.querySelectorAll("[data-open]").forEach(el => {
    el.addEventListener("click", () => {
      const id = parseInt(el.getAttribute("data-open"), 10);
      state.activeId = id;
      state.view = "read";
      if (!state.visited.has(id)) {
        state.visited.add(id);
        saveProgress(state.visited);
      }
      render();
    });
  });
  document.querySelectorAll("[data-back]").forEach(el => {
    el.addEventListener("click", () => {
      state.view = "select";
      state.activeId = null;
      render();
    });
  });
}

render();
</script>
</body>
</html>
